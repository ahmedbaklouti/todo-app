name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/todo_app?schema=public
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      REFRESH_COOKIE_NAME: refresh_token
      REFRESH_COOKIE_SECURE: false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d todo_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @todo-app/api prisma:generate

      - name: Lint monorepo
        run: pnpm lint

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Run API unit tests
        run: pnpm --filter @todo-app/api exec jest --runInBand

      - name: Run API e2e tests
        run: pnpm --filter @todo-app/api exec jest --config ./test/jest-e2e.json --runInBand

      - name: Build API
        run: pnpm --filter @todo-app/api build

      - name: Build web app
        run: pnpm --filter @todo-app/web build
