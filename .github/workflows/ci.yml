name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint monorepo
        run: pnpm lint

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Run API unit tests
        run: pnpm --filter @todo-app/api test -- --runInBand

      - name: Run API e2e tests
        run: pnpm --filter @todo-app/api test:e2e -- --runInBand

      - name: Build API
        run: pnpm --filter @todo-app/api build

      - name: Build web app
        run: pnpm --filter @todo-app/web build
